<svg fill="none" width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131D" />
      <stop offset="50%" stop-color="#0E2A38" />
      <stop offset="100%" stop-color="#004B54" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg)" />
  <circle cx="620" cy="120" r="140" fill="#00A896" opacity="0.15" />
  <circle cx="680" cy="90" r="80" fill="#028090" opacity="0.25" />

  <!-- Glass Card -->
  <rect x="40" y="35" width="720" height="170" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  
  <!-- Accent Line -->
  <rect x="70" y="60" width="100" height="4" rx="2" fill="#38BDF8" />

  <!-- Text -->
  <text x="70" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36">Syaz</text>
  <text x="70" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16">Software Engineer · SaaS Builder · UI/UX</text>

  <!-- Tech Badges -->
  <rect x="70" y="165" width="50" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="95" cy="177" r="5" fill="#E44D26" />
  <rect x="128" y="165" width="50" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="153" cy="177" r="5" fill="#41B883" />
  <rect x="186" y="165" width="50" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="211" cy="177" r="5" fill="#61DAFB" />
